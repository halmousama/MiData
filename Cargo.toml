[workspace]
resolver = "2"
members = ["xtask", "crates/midata-domain", "crates/midata-i18n"]

# Dependency policy (AGENTS.md rule 15, REBUILD_PLAN.md Appendix A):
# versions centralize here, and a dependency is added when the crate that first uses it is born —
# no pre-populated manifest entries, because an unused dependency is dead code by another name.
# P0-1 ships `xtask` (anyhow + serde_json); P0-2 adds the L0 pair (serde, chrono, thiserror).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# The shell's last-resort panic guard (AGENTS.md "never crash") requires unwinding.
[profile.release]
panic = "unwind"
