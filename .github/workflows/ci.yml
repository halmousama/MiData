name: CI

# The gate is the same code locally and in CI: every job runs `cargo xtask ci`, which executes
# fmt · clippy -D warnings · nextest · check-layers · file-budget · i18n-coverage · banned-name grep ·
# scorecard diff · cargo-deny · cargo-machete. Both OSes are binding (D12): Linux is the development
# OS, Windows is the release priority. Snapshots (Linux only) join the matrix with P0-5.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install CI-only tools (nextest, deny, machete)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete

      # One step, one definition of green. The gate prints a section per check, so a failure is
      # still attributable without duplicating the definition in YAML.
      - name: Pre-completion gate
        run: cargo xtask ci
