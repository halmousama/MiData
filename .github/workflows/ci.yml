name: CI

# The gate is the same code locally and in CI: every job runs `cargo xtask ci`, which executes
# fmt · nextest (the workspace minus `xtask`, then `xtask` itself in an isolated target dir) ·
# clippy -D warnings · check-layers · file-budget · i18n-coverage · banned-names · scorecard diff ·
# cargo-deny · cargo-machete — in that order, matching `xtask/src/ci.rs`. Both OSes are binding (D12):
# Linux is the development OS, Windows is the release priority. Snapshot goldens are not in this
# workflow yet; that deferral is tracked as a known shortfall in docs/gaps.md (target P0-9), not as
# prose here.
#
# Every action is pinned to a commit SHA (with the release tag in a trailing comment): the only
# supply-chain surface of an offline-first app is CI, so a mutable tag is a needless risk.

# Manual dispatch only (owner ruling D32, 2026-10-30): no `push` or `pull_request` trigger, so a
# branch push and a PR open cost no runner minutes. The workflow, matrix and steps are unchanged —
# the gate is still the same `cargo xtask ci` on ubuntu-latest and windows-latest (D12). Run it on a
# branch with:
#   gh workflow run ci.yml --ref <branch>
# then `gh run list --workflow ci.yml --branch <branch>` and `gh run watch <run-id>`. A dispatch is
# required before any phase gate, release tag, or merge touching a platform-sensitive surface
# (Windows path handling, file locks, process spawning, case-insensitive filesystems) — see
# AGENTS.md §3 rule 9 and docs/contributing.md §2. This is accepted risk, not a free pass: without a
# dispatch nothing server-side proves Windows.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install CI-only tools (nextest, deny, machete)
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete

      # One step, one definition of green. The gate prints a section per check, so a failure is
      # still attributable without duplicating the definition in YAML.
      - name: Pre-completion gate
        run: cargo xtask ci
