# cargo-deny policy (REBUILD_PLAN.md §13.1; AGENTS.md rule 15).
# Licence allowlist: MIT, Apache-2.0, BSD-2/3, ISC, Zlib, Unicode. Anything else is an escalation.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is the approved Appendix A set, not only what is in the lockfile today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
